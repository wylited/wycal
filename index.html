<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wycal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e14" />
    <script>
      // No-flash theme bootstrap: read persisted prefs and stamp data-theme on
      // <html> before first paint ('auto' resolves via CSS prefers-color-scheme).
      (() => {
        let theme = 'auto';
        try {
          const stored = JSON.parse(localStorage.getItem('wycal.prefs') || '{}');
          if (
            stored &&
            (stored.theme === 'light' || stored.theme === 'dark' || stored.theme === 'auto')
          ) {
            theme = stored.theme;
          }
        } catch {
          // Corrupted prefs fall back to the default below.
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
