# wycal local Radicale fixture (CONTRACTS.md §9).
# Relative paths (users, data) resolve against the process working directory;
# start.sh cds to scripts/radicale before exec'ing, so bare names are stable.
[server]
hosts = 127.0.0.1:5232
max_connections = 20
timeout = 30

[auth]
type = htpasswd
htpasswd_filename = users
htpasswd_encryption = bcrypt
# small delay on failed auth attempts
delay = 1

[rights]
# each user owns /<user>/ only; the fixture only ever talks to /demo/
type = owner_only

[storage]
# multifilesystem is Radicale's built-in storage backend
type = multifilesystem
filesystem_folder = data

[web]
type = internal

[logging]
level = info
